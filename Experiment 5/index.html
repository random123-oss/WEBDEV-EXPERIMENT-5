<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <meta name="description" content="Simple weather app that shows real-time weather of any city using the Fetch API.">

  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="sky-clear min-vh-100 d-flex align-items-center py-4">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="card weather-card border-0 shadow-lg rounded-4">
          <div class="card-body p-4">

            <h1 class="h3 text-center fw-bold mb-1">🌤️ Weather App</h1>
            <p class="text-center text-muted mb-4">Check the live weather of any city</p>

            
            <form id="weatherForm">
              <label for="cityInput" class="visually-hidden">City name</label>
              <div class="input-group">
                <input type="text" id="cityInput" class="form-control rounded-start-pill ps-4" placeholder="Search city, e.g. Delhi" required>
                <button type="submit" id="searchBtn" class="btn btn-primary rounded-end-pill px-4">Search</button>
              </div>
            </form>

            
            <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill city-btn" data-city="Delhi">Delhi</button>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill city-btn" data-city="Mumbai">Mumbai</button>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill city-btn" data-city="London">London</button>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill city-btn" data-city="Tokyo">Tokyo</button>
            </div>

            
            <div id="loader" class="text-center mt-4 d-none" role="status">
              <div class="spinner-border text-primary" aria-hidden="true"></div>
              <p class="text-muted small mt-2 mb-0">Getting the weather...</p>
            </div>

            
            <div id="error" class="alert alert-danger text-center mt-4 mb-0 d-none" role="alert"></div>

            
            <section id="result" class="result text-center mt-4 d-none">
              <p id="weatherIcon" class="icon mb-0"></p>
              <h2 id="cityName" class="h4 mb-0"></h2>
              <p id="temperature" class="display-3 fw-bold mb-0"></p>
              <p id="description" class="fs-5 text-muted mb-4"></p>

              <div class="row g-2">
                <div class="col-4">
                  <div class="stat-box bg-light rounded-3 p-2 p-sm-3">
                    <p class="small text-muted mb-0">🌡️ Feels like</p>
                    <p class="fw-semibold mb-0" id="feelsLike"></p>
                  </div>
                </div>
                <div class="col-4">
                  <div class="stat-box bg-light rounded-3 p-2 p-sm-3">
                    <p class="small text-muted mb-0">💧 Humidity</p>
                    <p class="fw-semibold mb-0" id="humidity"></p>
                  </div>
                </div>
                <div class="col-4">
                  <div class="stat-box bg-light rounded-3 p-2 p-sm-3">
                    <p class="small text-muted mb-0">💨 Wind</p>
                    <p class="fw-semibold mb-0" id="wind"></p>
                  </div>
                </div>
              </div>
            </section>

          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
